apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alerts
data:
  alerts.yml: |
    groups:
      - name: frisbee-sre-alerts
        rules:
          - alert: HighErrorRate
            expr: rate(app_requests_total{status="500"}[1m]) > 0.1
            for: 30s
            labels:
              severity: critical
            annotations:
              summary: "High error rate detected"
              description: "Error rate is above 0.1 requests/sec for 30 seconds"

          - alert: HighLatency
            expr: histogram_quantile(0.95, rate(app_request_latency_seconds_bucket[1m])) > 5
            for: 30s
            labels:
              severity: warning
            annotations:
              summary: "High p95 latency detected"
              description: "p95 latency is above 5 seconds for 30 seconds"

          - alert: PodRestarting
            expr: increase(kube_pod_container_status_restarts_total[5m]) > 0
            for: 0s
            labels:
              severity: warning
            annotations:
              summary: "Pod restart detected"
              description: "A pod has restarted in the last 5 minutes"