apiVersion: apps/v1
kind: Deployment
metadata:
  name: frisbee-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frisbee-api
  template:
    metadata:
      labels:
        app: frisbee-api
    spec:
      containers:
        - name: frisbee-api
          image: frisbee-api:v1
          ports:
            - containerPort: 8000
          imagePullPolicy: Never