apiVersion: apps/v1
kind: Deployment
metadata:
  name: frisbee-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frisbee-api
  template:
    metadata:
      labels:
        app: frisbee-api
    spec:
      containers:
        - name: frisbee-api
          image: zen2309/frisbee-api:v1
          ports:
            - containerPort: 8000
          imagePullPolicy: Always
          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3